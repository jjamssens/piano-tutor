<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="320" cy="360" rx="280" ry="200" fill="#4ade80" opacity="0.04" filter="url(#blur)"/>
  <ellipse cx="960" cy="360" rx="280" ry="200" fill="#818cf8" opacity="0.05" filter="url(#blur)"/>

  <!-- ── Left side: Text ── -->

  <!-- Badge -->
  <rect x="80" y="160" width="220" height="32" rx="16" fill="#4ade8018"/>
  <rect x="80" y="160" width="220" height="32" rx="16" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.4"/>
  <text x="190" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle" letter-spacing="2">FOR MAC + WINDOWS</text>

  <!-- Main title -->
  <text x="80" y="270" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-3">Piano</text>
  <text x="80" y="370" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="96" font-weight="900" fill="#4ade80" letter-spacing="-3">Tutor</text>

  <!-- Divider line -->
  <rect x="80" y="400" width="60" height="4" rx="2" fill="#4ade80" opacity="0.8"/>

  <!-- Tagline -->
  <text x="80" y="450" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="0.5">Learn piano with real-time feedback.</text>
  <text x="80" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="0.5">Plug in any MIDI keyboard. Play your first</text>
  <text x="80" y="514" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="0.5">song in minutes.</text>

  <!-- Feature pills -->
  <g transform="translate(80, 555)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="148" height="34" rx="17" fill="#1f2937"/>
    <text x="74" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db" text-anchor="middle">🎹 MIDI Support</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="160" height="34" rx="17" fill="#1f2937"/>
    <text x="240" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db" text-anchor="middle">🎵 Sheet Music</text>

    <!-- Pill 3 -->
    <rect x="332" y="0" width="172" height="34" rx="17" fill="#1f2937"/>
    <text x="418" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db" text-anchor="middle">⚡ Live Feedback</text>
  </g>

  <!-- ── Right side: Piano visual ── -->

  <!-- Falling notes column 1 (above key 3) -->
  <rect x="836" y="130" width="56" height="72" rx="10" fill="#4ade80" opacity="0.9" filter="url(#glow-filter)"/>
  <rect x="836" y="218" width="56" height="44" rx="10" fill="#4ade80" opacity="0.5"/>

  <!-- Falling notes column 2 (above key 6) -->
  <rect x="1002" y="100" width="56" height="54" rx="10" fill="#818cf8" opacity="0.85" filter="url(#glow-filter)"/>
  <rect x="1002" y="168" width="56" height="36" rx="10" fill="#818cf8" opacity="0.45"/>

  <!-- Falling notes column 3 (above key 4) -->
  <rect x="891" y="160" width="56" height="44" rx="10" fill="#818cf8" opacity="0.7"/>

  <!-- Falling notes column 4 (above key 7) -->
  <rect x="1057" y="140" width="56" height="60" rx="10" fill="#4ade80" opacity="0.55"/>

  <!-- Falling notes column 5 (above key 1) -->
  <rect x="726" y="180" width="56" height="38" rx="10" fill="#818cf8" opacity="0.5"/>

  <!-- Piano keyboard group — 8 white keys, centered right half -->
  <g transform="translate(700, 310)">

    <!-- White keys -->
    <rect x="0"   y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="68"  y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="136" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="204" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="272" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="340" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="408" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>
    <rect x="476" y="0" width="64" height="300" rx="0 0 8 8" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1"/>

    <!-- Active key highlight (key 1 — green) -->
    <rect x="0"   y="0" width="64" height="300" rx="0 0 8 8" fill="#4ade80" opacity="0.75"/>

    <!-- Active key highlight (key 4 — purple) -->
    <rect x="204" y="0" width="64" height="300" rx="0 0 8 8" fill="#818cf8" opacity="0.6"/>

    <!-- Black keys -->
    <rect x="44"  y="0" width="44" height="188" rx="0 0 6 6" fill="#111827"/>
    <rect x="112" y="0" width="44" height="188" rx="0 0 6 6" fill="#111827"/>
    <rect x="248" y="0" width="44" height="188" rx="0 0 6 6" fill="#111827"/>
    <rect x="316" y="0" width="44" height="188" rx="0 0 6 6" fill="#111827"/>
    <rect x="384" y="0" width="44" height="188" rx="0 0 6 6" fill="#111827"/>

  </g>

  <!-- Subtle bottom gradient to blend keyboard -->
  <rect x="640" y="560" width="700" height="160" fill="url(#bg)" opacity="0.6"/>

  <!-- Bottom strip -->
  <rect x="0" y="690" width="1280" height="30" fill="#0d1117" opacity="0.8"/>
  <text x="640" y="710" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle" letter-spacing="3">PIANO TUTOR · AVAILABLE FOR MAC &amp; WINDOWS</text>

</svg>

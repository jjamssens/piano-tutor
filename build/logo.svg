<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#0f1117"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Piano keys group — centered at 500, starting y=320 -->
  <!-- 7 white keys -->
  <g transform="translate(215, 310)">
    <!-- White keys -->
    <rect x="0"   y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="82"  y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="164" y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="246" y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="328" y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="410" y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="492" y="0" width="78" height="220" rx="6" fill="url(#keyGrad)" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Black keys -->
    <rect x="52"  y="0" width="52" height="138" rx="5" fill="#1f2937"/>
    <rect x="134" y="0" width="52" height="138" rx="5" fill="#1f2937"/>
    <rect x="298" y="0" width="52" height="138" rx="5" fill="#1f2937"/>
    <rect x="380" y="0" width="52" height="138" rx="5" fill="#1f2937"/>
    <rect x="462" y="0" width="52" height="138" rx="5" fill="#1f2937"/>

    <!-- Highlighted key (active note) — key 4 white (index 3) -->
    <rect x="246" y="0" width="78" height="220" rx="6" fill="#4ade80" opacity="0.85"/>

    <!-- Falling note bar above the highlighted key -->
    <rect x="254" y="-90" width="62" height="74" rx="8" fill="#4ade80" opacity="0.9"/>
    <!-- Second falling note -->
    <rect x="82"  y="-170" width="62" height="50" rx="8" fill="#818cf8" opacity="0.75"/>
    <!-- Third falling note -->
    <rect x="410" y="-130" width="62" height="60" rx="8" fill="#818cf8" opacity="0.65"/>
  </g>

  <!-- App name -->
  <text x="500" y="610" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Piano Tutor</text>

  <!-- Tagline -->
  <text x="500" y="668" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#6b7280" text-anchor="middle" letter-spacing="2">LEARN · PLAY · IMPROVE</text>

  <!-- Bottom accent line -->
  <rect x="380" y="700" width="240" height="3" rx="2" fill="#4ade80" opacity="0.6"/>
</svg>
